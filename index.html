<!DOCTYPE html>
<html lang="vi" data-theme="light" data-palette="gold" data-cochu="vua">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Thanh Vũ Medic CS3 | Quản Lý Công Việc & Điều Hành</title>
  <meta name="description" content="Hệ thống Quản lý Công việc & Điều Hành - Bệnh viện Đa Khoa Thanh Vũ Medic Cơ Sở 3 (Cà Mau)" />
  <meta name="theme-color" content="#d6a52a" />
  
  <!-- SCRIPT CHỐNG CHỚP MÀN HÌNH (ANTI-FLICKER) THEO CHUẨN SHIN AIOS (CHẠY TRƯỚC CSS) -->
  <script>
    (function() {
      try {
        var t = localStorage.getItem('shin_theme') || 'light';
        var p = localStorage.getItem('shin_palette') || 'gold';
        var c = localStorage.getItem('shin_cochu') || 'vua';
        var nav = localStorage.getItem('shin_navbar');
        var isDark = false;
        if (t === 'dark') isDark = true;
        else if (t === 'auto') isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        else if (t === 'time') {
          var h = new Date().getHours();
          isDark = (h < 6 || h >= 18);
        }
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme-mode', t);
        document.documentElement.setAttribute('data-palette', p);
        document.documentElement.setAttribute('data-cochu', c);
        if (nav === '0') {
          document.documentElement.classList.add('an-navbar');
        }
      } catch (e) {}
    })();
  </script>

  <!-- PRELOAD PHÔNG CHỮ BIỂU TƯỢNG CỤC BỘ (TRIỆT TIÊU FOUC / FOUT TỨC THÌ) -->
  <link rel="preload" href="fonts/material-symbols-outlined.woff2" as="font" type="font/woff2" crossorigin />

  <!-- FONTS & ICONS (PLUS JAKARTA SANS, JETBRAINS MONO & MATERIAL SYMBOLS OUTLINED) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <!-- TAILWIND CSS CDN DYNAMICALLY CONFIGURED WITH SHIN AIOS PALETTES -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'primary': 'var(--primary, #795900)',
            'primary-container': 'var(--primary-container, #d6a52a)',
            'on-primary-container': 'var(--on-primary-container, #533d00)',
            'secondary': 'var(--primary, #7c5806)',
            'secondary-container': 'var(--accent, #ffcd75)',
            'surface': 'var(--card, #ffffff)',
            'surface-card': 'var(--card, #ffffff)',
            'on-surface': 'var(--text, #0d1c2f)',
            'on-surface-variant': 'var(--text-muted, #4f4635)',
            'border-subtle': 'var(--border, #e2e8f0)',
            'gold-light': 'var(--primary-soft, #fffbeb)',
            'gold-border': 'var(--border, #fef3c7)',
            'gold-accent': 'var(--accent, #ffdea9)'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- SHIN AIOS MASTER UX/UI STYLESHEET -->
  <link rel="stylesheet" href="css/stitch-theme.css?v=7.7" />
</head>
<body class="antialiased min-h-screen transition-colors duration-200">

  <!-- APP SPLASH LOADER: TRIỆT TIÊU FOUC / FOUT (GIẬT ICON & VỠ LAYOUT) KHI TẢI TRANG BAN ĐẦU -->
  <div id="app-splash-loader" style="position: fixed; inset: 0; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8f9ff; transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <style>
      [data-theme="dark"] #app-splash-loader { background-color: #0d1522 !important; }
      [data-theme="dark"] #app-splash-loader .tvm-splash-title { color: #f8fafc !important; }
      [data-theme="dark"] #app-splash-loader .tvm-splash-sub { color: #94a3b8 !important; }
      [data-theme="dark"] #app-splash-loader .tvm-splash-status { color: #64748b !important; }
      @keyframes tvm-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes tvm-pulse-soft {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }
      .tvm-splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        background: linear-gradient(135deg, #d6a52a 0%, #b3831b 100%);
        box-shadow: 0 10px 25px -5px rgba(214, 165, 42, 0.35), 0 8px 10px -6px rgba(214, 165, 42, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        animation: tvm-pulse-soft 2s ease-in-out infinite;
      }
      .tvm-splash-spinner {
        position: absolute;
        inset: -6px;
        border-radius: 26px;
        border: 2.5px solid transparent;
        border-top-color: #d6a52a;
        border-right-color: rgba(214, 165, 42, 0.3);
        animation: tvm-spin 1s linear infinite;
      }
    </style>
    <div style="position: relative; margin-bottom: 24px;">
      <div class="tvm-splash-spinner"></div>
      <div class="tvm-splash-logo">
        <span style="font-weight: 800; font-size: 26px; color: #ffffff; letter-spacing: -0.5px;">TV</span>
      </div>
    </div>
    <div style="text-align: center; padding: 0 20px;">
      <h2 class="tvm-splash-title" style="margin: 0 0 6px 0; font-size: 17px; font-weight: 700; color: #0d1c2f; letter-spacing: -0.2px;">THANH VŨ MEDIC CS3</h2>
      <p class="tvm-splash-sub" style="margin: 0; font-size: 13px; color: #64748b; font-weight: 500;">Hệ thống Quản lý &amp; Điều hành Y tế</p>
    </div>
    <div style="margin-top: 28px; display: flex; align-items: center; gap: 8px;">
      <div style="width: 6px; height: 6px; border-radius: 50%; background-color: #d6a52a; animation: tvm-pulse-soft 1s infinite alternate;"></div>
      <span class="tvm-splash-status" style="font-size: 12px; color: #94a3b8; font-weight: 500; letter-spacing: 0.2px;">Đang đồng bộ giao diện &amp; phông chữ...</span>
    </div>
  </div>

  <!-- 0. LOGIN CONTAINER (HIỂN THỊ KHI CHƯA ĐĂNG NHẬP) -->
  <div id="login-container" class="hidden" style="display: none; pointer-events: none;"></div>

  <!-- 1. SIDEBAR CONTAINER (OFF-CANVAS MOBILE DRAWER & CỐ ĐỊNH TRÊN DESKTOP LG) -->
  <div id="sidebar-container"></div>

  <!-- TOP HEADER CONTAINER (CỐ ĐỊNH PHÍA TRÊN VIEWPORT) -->
  <div id="header-container"></div>

  <!-- 2. MAIN APP SHELL (lg:pl-64 CHO DESKTOP, pl-0 CHO MOBILE) -->
  <div id="main-app-shell" class="lg:pl-64 pl-0 min-h-screen flex flex-col transition-[padding] duration-200">
    <!-- MAIN SCROLLABLE CANVAS - CÔNG THÁI HỌC MOBILE FIRST VỚI pt-20 lg:pt-24 VÀ pb-24 lg:pb-12 -->
    <main class="pt-20 lg:pt-24 px-3.5 sm:px-6 lg:px-8 pb-24 lg:pb-12 flex-1 w-full max-w-[1600px] mx-auto overflow-x-hidden">
      <div id="main-content-canvas" class="view-transition"></div>
    </main>
  </div>

  <!-- 3. MOBILE BOTTOM NAVIGATION (HIỂN THỊ TRÊN MÀN HÌNH NHỎ LG:HIDDEN) -->
  <div id="mobile-nav-container"></div>

  <!-- 4. SLIDE-OVER TASK DETAIL DRAWER -->
  <div id="drawer-container"></div>

  <!-- 4.1 NOTIFICATION SLIDE-OVER DRAWER -->
  <div id="notification-drawer-container"></div>

  <!-- 5. MODALS (CREATE TASK / PROFILE / MEMBER / SETTINGS) -->
  <div id="modal-container"></div>

  <!-- 6. TOAST NOTIFICATIONS CONTAINER -->
  <div id="toast-container"></div>

  <!-- CORE APPLICATION LOGIC (ES MODULE) -->
  <script type="module" src="js/app.js?v=7.7"></script>
</body>
</html>
